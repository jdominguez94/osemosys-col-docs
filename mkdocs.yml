site_name: OSeMOSYS Colombia
site_description: Guía de usuario y documentación técnica del modelo energético colombiano en OSeMOSYS
repo_url: https://github.com/UPME-SubDemanda/Osemosys_UPME
repo_name: UPME-SubDemanda/Osemosys_UPME
docs_dir: docs

theme:
  name: material
  language: es
  logo: assets/upme-logo.jpg
  favicon: assets/upme-logo.jpg
  icon:
    admonition:
      tip: material/information-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: es

nav:
  - Home:
      - index.md
      - Funcionalidades: features.md
      - Getting Started:
          - ¿Qué es esta plataforma?: getting-started/plataforma.md
          - ¿Qué es OSeMOSYS?: getting-started/que-es-osemosys.md
          - Requisitos y solvers: getting-started/requisitos.md
          - Instalación: getting-started/installation.md
          - Quickstart 1 — Despacho económico: getting-started/quickstart-1-oferta-demanda.md
          - Quickstart 2 — Expansión de capacidad: getting-started/quickstart-2-expansion-capacidad.md
          - Quickstart 3 — Restricciones de política: getting-started/quickstart-3-restricciones-politica.md
      - Referencia:
          - Visión general: user-guide/overview.md
          - Escenarios y catálogos: user-guide/escenarios.md
          - Simulaciones: user-guide/simulaciones.md
          - Visualizaciones y reportes: user-guide/visualizaciones.md
          - Carga de datos Excel/SAND: user-guide/carga-excel-sand.md
      - Soporte: support.md
  - Ejemplos:
      - examples/index.md
      - Primera simulación: examples/first-simulation.md
      - Archivos SAND: examples/sand-files.md
      - Evolución de la matriz eléctrica: examples/matriz-electrica-escenarios.md
  - Contribuir: contributing.md
